name: Build and Push Microservices to GHCR

on:
  push:
    branches:
      - main  # 只有推送到 k8s 分支才触发,修改为main
    paths:
      - 'auth_service/**'
      - 'product_service/**'
      - 'order_service/**'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/kubernetes # 对应你的 ghcr.io/huangking170/xioahuang

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须有推送到 Packages 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 自动使用 GitHub 提供的 Token

      # 提取元数据（打标签）
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      # 构建并推送 auth_service
      - name: Build and push auth_service
        uses: docker/build-push-action@v5
        with:
          context: ./auth_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth_service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth_service:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      # 构建并推送 product_service
      - name: Build and push product_service
        uses: docker/build-push-action@v5
        with:
          context: ./product_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/product_service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/product_service:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      # 构建并推送 order_service
      - name: Build and push order_service
        uses: docker/build-push-action@v5
        with:
          context: ./order_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order_service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order_service:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}