{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # 将 /api/auth/login 重写为 /login 转发给后端
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # 1. 前端静态页面
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
          
          # 2. Auth 微服务 (匹配 /api/auth/...)
          - path: /api/auth(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-auth
                port:
                  number: 80
                  
          # 3. Product 微服务 (匹配 /api/product/...)
          - path: /api/product(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-product
                port:
                  number: 80
                  
          # 4. Order 微服务 (匹配 /api/order/...)
          - path: /api/order(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order
                port:
                  number: 80
{{- end }}